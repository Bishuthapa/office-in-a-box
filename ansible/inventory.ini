# Run from ctl01:  cd /vagrant/ansible && ansible all -m ping

[gateway]
gw01 ansible_host=10.10.0.1

[dns_master]
dns01 ansible_host=10.10.0.10

[dns_slave]
dns02 ansible_host=10.10.0.11

[web]
web01 ansible_host=10.10.0.20

[mail]
mail01 ansible_host=10.10.0.30

[files]
files01 ansible_host=10.10.0.40

[monitoring]
mon01 ansible_host=10.10.0.50

[servers:children]
gateway
dns_master
dns_slave
web
mail
files
monitoring

# client01 gets its IP from DHCP. Before phase 3, find it with `vagrant ssh client01 -c "ip -4 a"`
# and put it here; after phase 3 use its reserved address.
[clients]
client01 ansible_host=10.10.0.150

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.ssh/lab_ed25519
